name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Lint
        run: python -m ruff check .

      - name: Check doc references
        run: python scripts/tools/check_docs.py

      - name: Unit tests
        run: python -m pytest test/unit/ -q
