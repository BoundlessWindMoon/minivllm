env:
  default_dtype: bfloat16                  # [float16, bfloat16]
  device: cuda:0
  distributed:
    backend: nccl                         # [nccl, gloo]
    init_method: tcp://localhost:29500
    rank: 0
    world_size: 1

inference:
  backend: megakernel_cuda                # [default, megakernel_cuda]
  # Wrap prompt as a single user-turn chat message using tokenizer.chat_template.
  use_chat_template: false
  # When chat template is on, control whether to enable the model's built-in thinking block.
  use_thinking: false
  # Submodule paths to keep on CPU; pre/post forward hooks shuttle I/O across PCIe.
  cpu_offload_modules: []

  # Selects which .cu source under kernels/megakernel_cuda/{,variants/} is JIT-compiled.
  # Only used when backend == megakernel_cuda. Env var MINI_VLLM_MK_VARIANT overrides.
  megakernel_variant: default             # [default, naive, p0, p1, p3, p4, p6, p7, p8, p9, p9_combined, p10, all_combined]
  check_correction: false
  max_new_tokens: 256
  prompt: Hello, I am sakuya, I'm a 24 year old student from UCAS University. I like
    LLM and Infra
  sampling:
    sample_method: greedy                 # [greedy, topp]
    temperature: 1.0
    topk: 1
    topp: 1.0
  use_cuda_graph: false
  use_kvcache: true
  use_quantized_model: false
  attention_backend: sdpa
  # Set false during profile/bench so decode always runs the full max_new_tokens.
  stop_on_eos: false

path:
  baseline_model_path: ~/huggingface/baseline/
  data_path: ''
  model_path: ~/huggingface/Qwen3-0.6B/
  profile_dir: ./log/profile/
  quantized_model_path: ~/huggingface/Qwen3-0.6B-AWQ_Cached

quant:
  apply_clip: true
  backend: triton_wt_fused                # [gemm, triton, triton_wt, triton_wt_fused]
  calibration:
    data: pileval
    max_seq_length: 512
    n_samples: 32
    split: train
    text_column: text
  export_compatible: false
  group_size: 128                         # [128]
  has_zero_point: true
  layout: Wt                              # [Wt]
  max_chunk_memory: 1073741824
  pack_order: sequential                  # [sequential]
  quant_bits: 4                           # [4]
  quant_method: AWQ                       # [AWQ]
  quant_targets:
  - MLP
  - ATTENTION
  - LM_HEAD

profiling:
  torch_profiler:
    enabled: true
    profile_dir: ./log/profile/
  swanlab:
    enabled: false
    project: mini-vllm
    experiment_name: null
  json:
    enabled: false
    path: ./log/profile/profile.json
