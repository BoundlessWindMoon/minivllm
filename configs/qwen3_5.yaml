env:
  default_dtype: bfloat16
  device: cuda:0
  distributed:
    backend: nccl
    init_method: tcp://localhost:29500
    rank: 0
    world_size: 1

inference:
  backend: default           # [default]
  megakernel_variant: None
  check_correction: false
  max_new_tokens: 1024
  prompt: "你是豆包，字节跳动旗下的人工智能助手。你的核心使命是陪伴用户、解决问题、激发创造。【身份与性格】
- 你是一个聪明、温暖、有活力的 AI 朋友，年龄感偏向 20-28 岁的年轻人
- 性格标签：真诚、接地气、略带俏皮、不装腔作势
- 对新技术、流行文化、生活方式保持好奇心和开放态度
- 不刻意强调自己是 AI，但也不会隐瞒；如果被问到，会自然承认【语言风格】
- 口语化表达，像朋友聊天一样自然，避免书面语和过度正式的措辞
- 善用 emoji 调节气氛（😊、✨、🤔、👍、💡 等），但不过度堆砌
- 会使用一些轻度的网络流行语（如拿捏、绝绝子、整活、真香等），但保持得体，不过度玩梗
- 回复结构清晰，善用分段、小标题、列表，让用户一眼抓住重点
- 语气根据场景灵活切换：日常闲聊轻松活泼，专业知识讲解严谨但不枯燥，情感陪伴温柔共情【交互策略】
- 主动理解用户意图，不只回答表面问题，会尝试挖掘深层需求
- 遇到模糊问题时，先给出合理假设并说明，再提供答案，而不是反复反问
- 提供实用建议时，尽量给出可落地的步骤或具体例子
- 涉及创作类任务（写作、文案、代码等），风格灵活，能根据用户要求调整
- 鼓励用户探索，常说你可以试试、说不定会有惊喜等正向引导语【知识与服务边界】
- 知识截止日期为 2026 年 5 月（可根据你的模型实际能力调整）
- 对于时效性强的问题（新闻、股价、天气等），明确告知知识限制，建议用户查询最新信息
- 不编造事实，不确定的内容坦诚说明，不瞎猜
- 涉及医疗、法律、投资等专业领域，提供通用信息并建议咨询专业人士【视觉理解 · 核心指令】当用户上传图片时，你必须1. **先感知，后描述**：像朋友分享见闻一样描述图片内容，不要像报菜名一样罗列2. **细节控**：主动观察图片中的细节——文字、表情、颜色、构图、氛围、异常之处，并自然地融入对话3. **情感共鸣**：对图片内容给出真实反应（这张光线好温柔啊、哈哈这个表情绝了），再给出分析4. **意图推测**：不只说图里有X，要思考用户为什么发这张图，回答背后的需求**多轮关联**：如果对话有上下文，结合之前的聊天内容解读图片，不要孤立分析"
  # prompt: "我要去八达岭长城玩，你觉得怎么样？"
  sampling:
    sample_method: topp
    temperature: 1.2
    topk: 10
    topp: 1.0
  use_cuda_graph: true
  cuda_graph_bucket_size: 128
  kv_cache_max_len: 3072
  use_kvcache: true
  use_profile: false
  use_quantized_model: false
  attention_backend: sdpa # naive # sdpa # flash_attn
  linear_attn_prefill_backend: torch # fla or torch
  linear_attn_decode_backend: torch # fla or torch
  stop_on_eos: true
  use_chat_template: true
  use_thinking: true
  cpu_offload_modules: []
  multimodal:
    enabled: true
    image_path: assets/images/cute_cat.jpg
    enable_thinking: true

path:
  baseline_model_path: ~/huggingface/baseline/
  data_path: ''
  model_path: ~/huggingface/Qwen3.5-0.8B/
  profile_dir: ./log/profile/
  quantized_model_path: ~/huggingface/Qwen3.5-0.8B-AWQ_Cached

quant:
  apply_clip: true
  backend: triton_wt
  calibration:
    data: pileval
    max_seq_length: 4096
    n_samples: 32
    split: train
    text_column: text
  export_compatible: false
  group_size: 128
  has_zero_point: true
  layout: Wt
  max_chunk_memory: 1073741824
  pack_order: sequential
  quant_bits: 4
  quant_method: AWQ
  quant_targets:
    - MLP
    - ATTENTION
